# Each damage type's name + icon (a Unicode symbol) as shown in item lore and the GUI editor
# (NOT in action-bar combat feedback - that still runs off the fixed values in DamageType.java).
# "name" is used when that section's header (Damage on hit/Passive bonus/Resistances and
# weaknesses) is shown; "name-full" is used on damage/passive lines when their header is hidden
# (see gui.item-editor.*.header-toggle) - without a header, plain "Blunt" loses its context, so it
# becomes "Blunt damage" instead. "resist-full"/"weakness-full" is the same idea for resist/
# weakness lines - a separate phrase (not just "name-full" reused), since "Blunt damage" on a
# resistance line with no header would read like a damage bonus, not a resistance.
damage-type:
  physical:
    name: "ᴘʜʏꜱɪᴄᴀʟ"
