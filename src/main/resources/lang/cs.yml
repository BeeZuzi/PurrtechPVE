# Jméno + ikonka (Unicode symbol) každého damage typu, jak se ukazuje v loru itemu a v GUI editoru
# (NE v action-bar bojové zpětné vazbě - ta pořád jede z pevně daných hodnot v DamageType.java).
# "name" se použije, když je nadpis dané sekce (Poškození při útoku/Pasivní bonus/Odolnosti a
# slabiny) zobrazený; "name-full" se použije na řádcích poškození při útoku/pasivního bonusu, když
# je jejich nadpis skrytý (viz gui.item-editor.*.header-toggle) - bez nadpisu by samotné "Tupé"
# bylo mimo kontext, takže se místo toho napíše "Tupé poškození". "resist-full"/"weakness-full"
# je totéž, ale pro řádky odolností/slabin - musí to být vlastní, samostatně napsaná věta (ne jen
# "name-full" s jinou příponou), protože "Tupé poškození" by na odolnostním řádku bez nadpisu
# vypadalo jako bonus poškození, ne jako odolnost - a čeština navíc skloňuje přídavné jméno jinak
# ("proti tupému poškození", ne "tupé").
